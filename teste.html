<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Banner Carousel</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
.carousel-item{
    height:600px;
}

.carousel-item img{
    height:100%;
    object-fit:cover;
}

.carousel-caption{
    bottom:25%;
    background:rgba(0,0,0,.5);
    padding:20px;
    border-radius:10px;
}
</style>

</head>
<body>

<div id="bannerCarousel" class="carousel slide" data-bs-ride="carousel">

    <div class="carousel-indicators">
        <button data-bs-target="#bannerCarousel" data-bs-slide-to="0" class="active"></button>
        <button data-bs-target="#bannerCarousel" data-bs-slide-to="1"></button>
        <button data-bs-target="#bannerCarousel" data-bs-slide-to="2"></button>
    </div>

    <div class="carousel-inner">

        <div class="carousel-item active">
            <img src="https://picsum.photos/id/1015/1920/800" class="d-block w-100">
            <div class="carousel-caption">
                <h1>Primeiro Banner</h1>
                <p>Descrição do banner.</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/id/1016/1920/800" class="d-block w-100">
            <div class="carousel-caption">
                <h1>Segundo Banner</h1>
                <p>Descrição do banner.</p>
            </div>
        </div>

        <div class="carousel-item">
            <img src="https://picsum.photos/id/1018/1920/800" class="d-block w-100">
            <div class="carousel-caption">
                <h1>Terceiro Banner</h1>
                <p>Descrição do banner.</p>
            </div>
        </div>

    </div>

    <button class="carousel-control-prev" data-bs-target="#bannerCarousel" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" data-bs-target="#bannerCarousel" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
